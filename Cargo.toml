[package]
name = "zfstack"
version = "0.0.1"
edition = "2021"
publish = false
description = "Userspace TCP stack specialised for proxy/forwarding dataplanes (passive-open, IP-packet in/out, stream out)."

[dependencies]
bytes = "1"
tokio = { version = "1", optional = true, features = ["rt", "sync", "time", "macros", "io-util", "net"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "io-util", "rt-multi-thread", "net"] }

[features]
default = []
# Async adapter (AsyncRead/AsyncWrite stream handles + driver). Core stays runtime-agnostic.
tokio = ["dep:tokio"]
# Active open + deterministic simulator (tests / benchmarks only, §0).
test-peer = []

[workspace]
members = ["bench"]
resolver = "2"
