[package]
name = "zfharness"
version = "0.1.0"
edition = "2021"
publish = false
description = "Multi-tenant zfstack harness: deterministic sans-IO (L0) and the scenario catalog for issue #24"

[dependencies]
bytes = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
zfstack = { path = "..", features = ["test-peer"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
