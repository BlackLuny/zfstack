[package]
name = "zfharness"
version = "0.1.0"
edition = "2021"
publish = false
description = "Multi-tenant zfstack harness: deterministic sans-IO (L0) and the scenario catalog for issue #24"

[dependencies]
bytes = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde_json = "1"
zfstack = { path = "..", features = ["test-peer"] }
