name: QA dependency lock review
on:
  schedule:
    - cron: '35 19 1 * *'
  workflow_dispatch:
    inputs:
      scope:
        description: Cargo workspace lockfiles to update
        type: choice
        options: [all, root, models, fuzz]
        default: all
      package:
        description: Optional Cargo package selector; empty updates the selected workspace
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: qa-dependency-review
  cancel-in-progress: false
jobs:
  review:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - run: rustup toolchain install nightly-2026-07-11 --profile minimal
      - run: python -m pip install -r qa/requirements.lock
      - name: Generate patch without committing or publishing
        env:
          UPDATE_SCOPE: ${{ inputs.scope || 'all' }}
          UPDATE_PACKAGE: ${{ inputs.package }}
        run: python -m qa.release update-locks --scope "$UPDATE_SCOPE" --package "$UPDATE_PACKAGE" --output "$RUNNER_TEMP/dependency-review"
      - name: Validate updated locked dependencies
        run: |
          python -m unittest discover -s qa/tests -p 'test_*.py'
          python -m unittest discover -s harness/l2 -p 'test_*.py'
          python -m unittest discover -s bench/pareto -p 'test_*.py'
          cargo +1.94.1 fmt --all -- --check
          cargo +1.94.1 clippy --locked --workspace --all-targets --features zfstack/tokio
          cargo +1.94.1 build --locked -p zfstack --no-default-features
          cargo +1.94.1 test --locked --release -p zfstack --features tokio,test-peer
          cargo +1.94.1 test --locked --release -p zfharness
          cargo +1.94.1 test --locked --release -p zfbench --all-features
          cargo +1.94.1 test --locked --manifest-path qa-models/Cargo.toml
          cargo +nightly-2026-07-11 check --locked --manifest-path fuzz/Cargo.toml --bins
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qa-dependency-lock-review
          path: ${{ runner.temp }}/dependency-review
          if-no-files-found: error
          retention-days: 30
