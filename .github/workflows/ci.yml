name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: '1.94.1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - run: python -m pip install -r qa/requirements.lock
      - name: Freeze trusted policy and exact tested SHA
        env:
          TRUSTED_REF: ${{ vars.QA_TRUSTED_REF || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          TESTED_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m qa.workflow prepare-policy --ref "$TRUSTED_REF" --output "$RUNNER_TEMP/qa-policy"
          python -m qa make-plan --policy "$RUNNER_TEMP/qa-policy" --tested-sha "$TESTED_SHA" --head-sha "$HEAD_SHA" --base-sha "$TRUSTED_REF" --output "$RUNNER_TEMP/plan.json"
      - name: Run declared lint cases
        run: python -m qa.workflow run-group lint --plan "$RUNNER_TEMP/plan.json" --policy "$RUNNER_TEMP/qa-policy" --output qa/results/lint
      - name: Stage allowlisted evidence
        if: always()
        run: python -m qa.workflow stage-upload --source qa/results/lint --output "$RUNNER_TEMP/upload-lint"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qa-lint
          path: ${{ runner.temp }}/upload-lint
          if-no-files-found: error
          retention-days: 14
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - run: python -m pip install -r qa/requirements.lock
      - name: Freeze trusted policy and exact tested SHA
        env:
          TRUSTED_REF: ${{ vars.QA_TRUSTED_REF || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          TESTED_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m qa.workflow prepare-policy --ref "$TRUSTED_REF" --output "$RUNNER_TEMP/qa-policy"
          python -m qa make-plan --policy "$RUNNER_TEMP/qa-policy" --tested-sha "$TESTED_SHA" --head-sha "$HEAD_SHA" --base-sha "$TRUSTED_REF" --output "$RUNNER_TEMP/plan.json"
      - name: Run declared test cases
        run: python -m qa.workflow run-group test --plan "$RUNNER_TEMP/plan.json" --policy "$RUNNER_TEMP/qa-policy" --output qa/results/test
      - name: Stage allowlisted evidence
        if: always()
        run: python -m qa.workflow stage-upload --source qa/results/test --output "$RUNNER_TEMP/upload-test"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qa-test
          path: ${{ runner.temp }}/upload-test
          if-no-files-found: error
          retention-days: 14
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - run: python -m pip install -r qa/requirements.lock
      - name: Freeze trusted policy and exact tested SHA
        env:
          TRUSTED_REF: ${{ vars.QA_TRUSTED_REF || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          TESTED_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m qa.workflow prepare-policy --ref "$TRUSTED_REF" --output "$RUNNER_TEMP/qa-policy"
          python -m qa make-plan --policy "$RUNNER_TEMP/qa-policy" --tested-sha "$TESTED_SHA" --head-sha "$HEAD_SHA" --base-sha "$TRUSTED_REF" --output "$RUNNER_TEMP/plan.json"
      - name: Run declared bench cases
        run: python -m qa.workflow run-group bench --plan "$RUNNER_TEMP/plan.json" --policy "$RUNNER_TEMP/qa-policy" --output qa/results/bench
      - name: Stage allowlisted evidence
        if: always()
        run: python -m qa.workflow stage-upload --source qa/results/bench --output "$RUNNER_TEMP/upload-bench"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qa-bench
          path: ${{ runner.temp }}/upload-bench
          if-no-files-found: error
          retention-days: 14
  l0:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - run: python -m pip install -r qa/requirements.lock
      - name: Freeze trusted policy and exact tested SHA
        env:
          TRUSTED_REF: ${{ vars.QA_TRUSTED_REF || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          TESTED_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m qa.workflow prepare-policy --ref "$TRUSTED_REF" --output "$RUNNER_TEMP/qa-policy"
          python -m qa make-plan --policy "$RUNNER_TEMP/qa-policy" --tested-sha "$TESTED_SHA" --head-sha "$HEAD_SHA" --base-sha "$TRUSTED_REF" --output "$RUNNER_TEMP/plan.json"
      - name: Run declared l0 cases
        run: python -m qa.workflow run-group l0 --plan "$RUNNER_TEMP/plan.json" --policy "$RUNNER_TEMP/qa-policy" --output qa/results/l0
      - name: Stage allowlisted evidence
        if: always()
        run: python -m qa.workflow stage-upload --source qa/results/l0 --output "$RUNNER_TEMP/upload-l0"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qa-l0
          path: ${{ runner.temp }}/upload-l0
          if-no-files-found: error
          retention-days: 14
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - run: python -m pip install -r qa/requirements.lock
      - name: Freeze trusted policy and exact tested SHA
        env:
          TRUSTED_REF: ${{ vars.QA_TRUSTED_REF || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          TESTED_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m qa.workflow prepare-policy --ref "$TRUSTED_REF" --output "$RUNNER_TEMP/qa-policy"
          python -m qa make-plan --policy "$RUNNER_TEMP/qa-policy" --tested-sha "$TESTED_SHA" --head-sha "$HEAD_SHA" --base-sha "$TRUSTED_REF" --output "$RUNNER_TEMP/plan.json"
      - name: Run declared tools cases
        run: python -m qa.workflow run-group tools --plan "$RUNNER_TEMP/plan.json" --policy "$RUNNER_TEMP/qa-policy" --output qa/results/tools
      - name: Stage allowlisted evidence
        if: always()
        run: python -m qa.workflow stage-upload --source qa/results/tools --output "$RUNNER_TEMP/upload-tools"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qa-tools
          path: ${{ runner.temp }}/upload-tools
          if-no-files-found: error
          retention-days: 14
  gate:
    name: qa/gate
    if: always()
    needs: [lint, test, bench, l0, tools]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Reporter code/policy comes from a reviewed immutable base, never a PR artifact.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ vars.QA_TRUSTED_REF || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require trusted reporter bootstrap
        run: |
          test -f qa/evaluate.py || { echo 'BLOCKED: configure reviewed QA_TRUSTED_REF for initial rollout'; exit 2; }
          python -m pip install -r qa/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: always()
        with:
          pattern: qa-*
          path: evidence
      - name: Evaluate required jobs and artifacts
        if: always()
        env:
          JOBS_JSON: ${{ toJSON(needs) }}
          TESTED_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TRUSTED_REF: ${{ vars.QA_TRUSTED_REF || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
        run: |
          test -f qa/evaluate.py || exit 2
          python -c 'import os,pathlib; pathlib.Path("jobs.json").write_text(os.environ["JOBS_JSON"])'
          python -m qa make-plan --platform linux-x86_64 --tested-sha "$TESTED_SHA" --head-sha "$HEAD_SHA" --base-sha "$TRUSTED_REF" --output expected-plan.json
          python -m qa evaluate --ci --jobs jobs.json --plan expected-plan.json --results evidence --expected-sha "$TESTED_SHA" --output summary.json --report report.md
      - name: Publish summary
        if: always()
        run: test ! -f report.md || cat report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qa-gate-report
          path: |
            summary.json
            report.md
          if-no-files-found: error
          retention-days: 30
