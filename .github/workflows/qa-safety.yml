name: QA memory safety and fuzz
on:
  schedule:
    - cron: '50 18 * * 2,5'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  TRUSTED_REF: ${{ vars.QA_TRUSTED_REF || github.sha }}
jobs:
  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r qa/requirements.lock
      - name: Freeze reviewed policy
        run: python -m qa.workflow prepare-policy --ref "$TRUSTED_REF" --output "$RUNNER_TEMP/qa-policy"
      - run: rustup toolchain install 1.94.1 --profile minimal
      - run: rustup toolchain install nightly-2026-07-11 --profile minimal --component miri --component rust-src
      - run: cargo +1.94.1 install cargo-fuzz --version 0.13.2 --locked
      - name: Named safety targets (separate from performance)
        run: |
          python -m qa make-plan --policy "$RUNNER_TEMP/qa-policy" --suite safety --output plan.json
          python -m qa run-plan --policy "$RUNNER_TEMP/qa-policy" --plan plan.json --output qa/results/safety
      - name: Retain failures
        if: always()
        run: python -m qa.workflow stage-upload --source qa/results/safety --output "$RUNNER_TEMP/upload"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qa-safety
          path: ${{ runner.temp }}/upload
          if-no-files-found: error
          retention-days: 30
